name: espocrm-qa
services:
  mailpit:
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
  mariadb:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Run npm run local:init}
      MARIADB_USER: ${DB_USER:?Run npm run local:init}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run npm run local:init}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run npm run local:init}
      DB_READ_USER: ${DB_READ_USER:?Run npm run local:init}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:?Run npm run local:init}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  espocrm:
    image: espocrm/espocrm@sha256:817f2b063de2c9dc2655fedbf1960af33c9b04e84d61a4b95f243e8e9189de69
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_HOST: mariadb
      ESPOCRM_DATABASE_NAME: ${DB_NAME}
      ESPOCRM_DATABASE_USER: ${DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${BASE_URL:-http://localhost:8080}
      ESPOCRM_LANGUAGE: en_US
      ESPOCRM_TIME_ZONE: UTC
      ESPOCRM_DATE_FORMAT: ${ESPOCRM_DATE_FORMAT:-DD.MM.YYYY}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - app-data:/var/www/html/data
      - app-custom:/var/www/html/custom
      - app-client:/var/www/html/client/custom
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 24
  daemon:
    image: espocrm/espocrm@sha256:817f2b063de2c9dc2655fedbf1960af33c9b04e84d61a4b95f243e8e9189de69
    restart: unless-stopped
    entrypoint: docker-daemon.sh
    volumes_from:
      - espocrm
    depends_on:
      espocrm:
        condition: service_healthy
volumes:
  database:
  app-data:
  app-custom:
  app-client:
