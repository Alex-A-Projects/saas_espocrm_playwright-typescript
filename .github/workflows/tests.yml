name: EspoCRM tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run local:init
      - run: npm run local:up
      - run: npm run typecheck
      - run: npm test
        env:
          WORKERS: 2
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            docker.log
          retention-days: 7
      - name: Stop local stack
        if: always()
        run: docker compose down
